# Compila un APK de prueba (debug) en cada push a main o a ramas dev/*.
# El APK queda en la pestaña "Actions" del repo, como artefacto "rcerito-debug-apk".
name: APK de prueba

on:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rcerito-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

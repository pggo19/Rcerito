# Compila un APK de prueba (debug) en cada push a main o a ramas dev/*.
# El APK queda en la pestaña "Actions" (artefacto "rcerito-debug-apk") y, en main,
# como descarga directa en Releases > "apk-prueba".
name: APK de prueba

on:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rcerito-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar el APK como versión de prueba
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-prueba
          name: APK de prueba (última versión de main)
          prerelease: true
          make_latest: false
          body: "APK de prueba compilado desde main (${{ github.sha }}). Descárgalo desde el teléfono e instálalo permitiendo apps de orígenes desconocidos."
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
